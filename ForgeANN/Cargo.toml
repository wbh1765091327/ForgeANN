[package]
name = "forgeann"
version = "0.1.0"
edition = "2024"

[features]
default = ["metrics"]
metrics = ["cmp", "io"]
cmp = []
io = []
distance = []
ffi = []
access_pattern = []
full_precision = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
byteorder = "1.4.3"
bytemuck = { version = "1.15.0", features = ["derive"] }
cblas = "0.5.0"
crossbeam = "0.8.2"
hashbrown = "0.15"
libc = "0.2"
num-traits = "0.2.15"
rand = { version = "0.9", features = [ "small_rng" ] }
rayon = "1.11.0"
serde = { version = "1.0.130", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2.0"
tracing = "0.1"
memmap2 = "0.5"
monoio = { workspace = true }
indicatif = "0.17.8"
futures-util = { version = "0.3", default-features = false }
ndarray = { version = "0.14.0", features = ["blas"] }
io-uring = { workspace = true }
crossbeam-queue = "0.3.12"
parking_lot = "0.12"
tempfile = "3.20"

[dev-dependencies]
approx = "0.5.1"
